<section class="section" style="text-align: center;">
    <h2>Contact Us</h2>
    <p style="margin-bottom: 30px;">Fill out the form below and our team will get back to you within 24 hours.</p>
    
    <div class="card" style="max-width: 500px; width: 100%; margin: 0 auto; text-align: left; display: block;">
        <form>
            <label style="color: #cbd5f5;">Name:</label>
            <input type="text" placeholder="Enter your full name" required style="margin-bottom: 15px;">
            
            <label style="color: #cbd5f5;">Email:</label>
            <input type="email" placeholder="Enter your email" required style="margin-bottom: 15px;">
            
            <label style="color: #cbd5f5;">Message:</label>
            <textarea rows="5" placeholder="Tell us about your event details" required style="margin-bottom: 15px; resize: vertical;"></textarea>
            
            <button type="submit" style="width: 100%; margin-top: 10px;">Send Message</button>
        </form>
    </div>
</section>
